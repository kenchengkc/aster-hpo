name: Native CPU

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,benchmark]' cmake ninja
      - run: python -m pip install ./native
      - run: cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - run: ASTER_ACCOUNTING_BENCH="$PWD/build/native/accounting_bench" python -m pytest tests native/tests cuda/tests -q
      - run: python -m build native --outdir dist/native

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cmake -S native -B build/native-sanitizers -DCMAKE_BUILD_TYPE=Debug -DASTER_ENABLE_SANITIZERS=ON -DASTER_BUILD_BENCHMARKS=OFF
      - run: cmake --build build/native-sanitizers --parallel 2
      - run: ctest --test-dir build/native-sanitizers --output-on-failure
      - run: c++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -Icuda/include cuda/tests/test_comparison.cpp -o build/cuda-comparison-sanitizers
      - run: ./build/cuda-comparison-sanitizers
