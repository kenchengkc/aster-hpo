name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,benchmark]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python examples/noisy_quadratic.py --workers 2 --configs 8
      - run: python -m build

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,benchmark,baseline]'
      - run: python -m pytest tests/test_asha.py -q
